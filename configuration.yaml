template:
  - sensor:
      - name: "Total Propane Consumed"
        unique_id: total_propane_consumed
        unit_of_measurement: "gal"
        device_class: volume
        state_class: total_increasing
        icon: "mdi:fire-circle"
        state: >
          {% set total_capacity = 120.0 %}
          {% set current_level = states('sensor.propane_tank_level') | float(none) %}
          {% if current_level is not none %}
            {# Calculates cumulative gallons used from a completely full 80% tank #}
            {{ ((80.0 - current_level) * 1.2) | round(2) }}
          {% else %}
            {{ states('sensor.total_propane_consumed') }}
          {% endif %}

# 2. Feed that continuous count into a Monthly Utility Meter tracker
utility_meter:
  monthly_propane_usage:
    source: sensor.total_propane_consumed
    name: "Monthly Propane Consumption"
    cycle: monthly
network:
  ingress_interfaces:
