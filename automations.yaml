- alias: "Auto Off: Basement Exterior"
  description: "Automatically turns off Basement Exterior light based on helper minutes or dawn."
  use_blueprint:
    path: jepa/persistent_light_auto_off.yaml
    input:
      controlled_entity: switch.basement_basement_exterior_light
      minutes_helper: input_number.light_auto_off_minutes_basement_exterior
      deadline_helper: input_datetime.light_shutoff_time_basement_exterior

